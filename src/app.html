<title>Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una columna angosta pensada para el celular; resumen arriba, anotador, después pestañas de detalle. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --sunk:#f5f8f6; --ink:#16201d; --muted:#5a6a65; --line:#d8e0dc;
  --accent:#0e6a5b; --accent-ink:#ffffff; --accent-soft:#d9eee8;
  --gasto:#b2432c; --ingreso:#1d7a3f; --warn:#8a5a00; --warn-bg:#fbf0d9;
  --c0:#0e6a5b; --c1:#c27812; --c2:#3a5db6; --c3:#a33f78; --c4:#5a881c; --c5:#7650c4; --c6:#c4512f; --c7:#2a87a1;
  --v-ing:#2f6fd0; --v-gas:#c8691a; --grid:#e3e9e6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#172120; --sunk:#131b1a; --ink:#e4ece9; --muted:#93a49f; --line:#27332f;
  --accent:#52c3a9; --accent-ink:#04221b; --accent-soft:#16352e;
  --gasto:#f08c71; --ingreso:#6fd291; --warn:#f0c46a; --warn-bg:#2e2510;
  --c0:#52c3a9; --c1:#f0a640; --c2:#7f9cf0; --c3:#e27cb6; --c4:#9cce5a; --c5:#ad8cf2; --c6:#f08c71; --c7:#5cc4df;
  --v-ing:#5585dc; --v-gas:#c9772f; --grid:#26312f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --sunk:#131b1a; --ink:#e4ece9; --muted:#93a49f; --line:#27332f;
  --accent:#52c3a9; --accent-ink:#04221b; --accent-soft:#16352e;
  --gasto:#f08c71; --ingreso:#6fd291; --warn:#f0c46a; --warn-bg:#2e2510;
  --c0:#52c3a9; --c1:#f0a640; --c2:#7f9cf0; --c3:#e27cb6; --c4:#9cce5a; --c5:#ad8cf2; --c6:#f08c71; --c7:#5cc4df;
  --v-ing:#5585dc; --v-gas:#c9772f; --grid:#26312f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:12px 64px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.app > *{min-width:0}
#main{width:100%}
.bal-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.bal-row:first-child{border-top:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:999px;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--sunk);color:var(--ink)}
#monthLabel{min-width:118px;text-align:center;font-weight:600}

.status{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}

.summary{display:flex;flex-direction:column;gap:12px;padding-block:4px}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:-.02em;display:block}
.sum-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum-row b{display:block;font-size:16px;font-weight:600}
.strip{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line)}
.strip span{display:block;height:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.composer{display:flex;flex-direction:column;gap:10px}
.composer > label{font-family:var(--display);font-weight:600;font-size:18px}
.comp-box{display:flex;gap:8px;align-items:stretch}
#frase{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:16px}
#frase:focus{border-color:var(--accent);outline:none}
.hint{margin:0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint svg{flex:none;margin-top:2px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--gasto)}
.btn.mic{display:grid;place-items:center;padding:0 12px;color:var(--accent)}
.btn.mic.on{background:var(--gasto);border-color:var(--gasto);color:#fff}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
pre.code{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;overflow-x:auto;max-height:260px;margin:0}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chart{position:relative}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart text.sel{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.12);white-space:nowrap;z-index:2}
.tip b{display:block;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:17px;font-family:var(--display);margin-top:2px}
.tile small{color:var(--muted);font-size:12px}
.delta{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
@media (max-width:420px){.tile{padding:8px}.tile b{font-size:14px}.tile small{font-size:11px}}
.btn.small{padding:6px 10px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.drafts{display:flex;flex-direction:column;gap:10px}
.drafts-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;align-self:flex-start;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.parts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.grid .wide{grid-column:1/-1}
.grid input,.grid select,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%;min-width:0}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.cfg-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.cfg-row:first-child{border-top:0}
.cfg-row input,.inline input,.inline select,#setCur,#setupCur{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--ink);width:100%;min-width:0}
.cfg-row .nm{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input{flex:1 1 160px;width:auto}
.inline select{flex:0 1 auto;width:auto}
.muted{color:var(--muted);font-size:13px;margin:0}
@media (max-width:480px){.cfg-row{grid-template-columns:minmax(0,1fr) auto}.cfg-row > :nth-child(2){grid-column:1/-1;grid-row:2}}
.tabs button{flex:none;border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{display:flex;flex-direction:column;gap:14px}
.filter-note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day{display:flex;flex-direction:column}
.day h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between;font-weight:600}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 4px;border-top:1px solid var(--line)}
.day .row:first-of-type{border-top:0}
.row:hover{background:var(--sunk)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:12px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.amt.g{color:var(--ink)}
.amt.i{color:var(--ingreso)}
.badge{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:4px}

.empty{text-align:center;color:var(--muted);padding:28px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--display);font-size:18px}

.catlist{display:flex;flex-direction:column;gap:2px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;border:0;background:none;text-align:left;padding:8px 4px;border-radius:8px;width:100%}
.catrow:hover{background:var(--sunk)}
.catrow .n{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.catrow .bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.catrow .bar i{display:block;height:100%;border-radius:999px}
.catrow .pct{color:var(--muted);font-size:12px;font-weight:400;margin-left:6px}
h2{font-family:var(--display);font-size:18px;margin:4px 0 0;font-weight:600}

.imp p{margin:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.file{display:flex;flex-direction:column;gap:6px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.file input{max-width:100%;margin:0 auto;color:var(--muted)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
.stats{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;background:var(--sunk)}
td.r,th.r{text-align:right}
td.d{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px}

.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:10}
.toast.err{background:var(--gasto);color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
@media (max-width:380px){.grid{grid-template-columns:minmax(0,1fr)}.sum-row b{font-size:14px}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">$</span>Bolsillo</div>
    <div class="month" aria-label="Mes">
      <button type="button" data-action="prev" aria-label="Mes anterior">‹</button>
      <span id="monthLabel"></span>
      <button type="button" data-action="next" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <div id="status" class="status" hidden></div>

  <section id="setup" class="card panel" hidden></section>

  <div id="main" class="app">
  <section class="summary" aria-label="Resumen del mes">
    <div><span class="lbl" id="sumGastoLbl">Gastos del mes</span><span id="sumGasto" class="big num">$ 0</span></div>
    <div class="sum-row">
      <div><span class="lbl">Ingresos</span><b id="sumIng" class="num">$ 0</b></div>
      <div><span class="lbl">Balance</span><b id="sumBal" class="num">$ 0</b></div>
      <div><span class="lbl">Por día</span><b id="sumAvg" class="num">$ 0</b></div>
    </div>
    <div id="catStrip" class="strip" aria-hidden="true"></div>
  </section>

  <section class="card composer">
    <label for="frase">Anotá un gasto</label>
    <div class="comp-box">
      <textarea id="frase" rows="2" placeholder="Ej: gasté 4.500 en el chino con la Galicia" enterkeyhint="send"></textarea>
      <button id="btnMic" class="btn mic" type="button" data-action="mic" aria-label="Dictar el gasto" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button>
      <button id="btnAnotar" class="btn primary" type="button" data-action="anotar">Anotar</button>
    </div>
    <p class="hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      <span id="hintText">Para anotar hablando, tocá el micrófono del teclado y dictá. Podés decir varios juntos: "2 lucas de nafta y 3.800 de farmacia con Mercado Pago".</span></p>
    <div class="chips" id="examples"></div>
    <div id="drafts" class="drafts"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="movs" aria-selected="true">Movimientos</button>
    <button type="button" role="tab" data-tab="cats" aria-selected="false">Análisis</button>
    <button type="button" role="tab" data-tab="grupos" aria-selected="false">Grupos</button>
    <button type="button" role="tab" data-tab="import" aria-selected="false">Importar</button>
    <button type="button" role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
  </nav>

  <section id="tab-movs" class="panel"></section>
  <section id="tab-cats" class="panel" hidden></section>
  <section id="tab-grupos" class="panel" hidden></section>
  <section id="tab-import" class="panel imp" hidden></section>
  <section id="tab-ajustes" class="panel" hidden></section>
  </div>

  <p class="foot" id="foot"></p>
</div>
<div id="toast" class="toast" hidden role="status"></div>

function parseNum(v){

  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (s.endsWith('-')) { neg = !neg; s = s.slice(0,-1); }

  else if (lc>-1) s = ((s.match(/,/g)||[]).length===1 && s.length-lc-1<=2) ? s.replace(',','.') : s.replace(/,/g,'');
  else if (ld>-1 && ((s.match(/\./g)||[]).length>1 || s.length-ld-1===3)) s = s.replace(/\./g,'');

}

const WORDNUM = {un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,cien:100};
const DOW = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
function normAmounts(t){
  t = t.replace(/(\d)\s*k\b/g, '$1 mil');
  t = t.replace(/\b(un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|treinta|cuarenta|cincuenta|cien)\s+(mil|lucas?|palos?|gambas?)\b/g, (m,w,u)=>WORDNUM[w]+' '+u);
  t = t.replace(/\bmedia\s+luca\b/g, '500');
  t = t.replace(/\b(\d+(?:[.,]\d+)?)\s+(lucas?|mil|palos?|gambas?)(\s+y\s+media)?(\s+quinientos)?\b/g, (m,n,u,ym,q)=>{
    const base = parseFloat(n.replace(',','.')); const mult = /palo/.test(u)?1e6:/gamba/.test(u)?100:1000;
    return String(Math.round(base*mult + (ym?mult/2:0) + (q?500:0)));
  });
  t = t.replace(/\bluca\s+y\s+media\b/g,'1500').replace(/\bluca\b/g,'1000').replace(/\bmil\s+quinientos\b/g,'1500').replace(/\bmil\b/g,'1000');
  return t;
}
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const accTerms = a => [...new Set([norm(a.name), ...(a.alias||[]).map(norm)])].filter(Boolean);
function detectAccount(n){
  for (const a of ACC) for (const t of accTerms(a)) if (new RegExp('(^|[^a-z0-9])' + rxEsc(t) + '($|[^a-z0-9])').test(n)) return a.name;
  return null;
}
function detectDate(n){
  const d = new Date(today);
  if (/antes de ayer|anteayer/.test(n)) { d.setDate(d.getDate()-2); return ymd(d); }
  if (/\bayer\b/.test(n)) { d.setDate(d.getDate()-1); return ymd(d); }
  const w = n.match(/\b(el|este|el pasado)\s+(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/);
  if (w) { const target = DOW.indexOf(w[2]); const back = ((d.getDay()-target+7)%7) || 7; d.setDate(d.getDate()-back); return ymd(d); }
  const m = n.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (m) { let y = m[3] ? +m[3] : d.getFullYear(); if (y<100) y+=2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  return null;
}
function guessCat(text, tipo){
  const n = ' ' + norm(text) + ' ';
  for (const c of CATS) {
    if (c.t !== tipo) continue;
    for (const k of c.k) if (new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace('%','\\b')).test(n)) return c.id;
  }

}
const INGRESO_RX = /\b(cobre|me pagaron|me transfirieron|me depositaron|me pasaron|me mandaron|ingreso|ingresaron|sueldo|aguinaldo|recibi|vendi|me entro|me entraron|gane|me devolvieron|reintegro|cashback)\b/;
function cleanDesc(p){
  // Se trabaja sin tildes para que coincidan los alias de las cuentas.
  let s = ' ' + norm(p) + ' ';
  const terms = ACC.flatMap(accTerms).sort((a,b)=>b.length-a.length).map(rxEsc).join('|');
  if (terms) {
    s = s.replace(new RegExp(`\\b(con|por|desde|en|de|del)\\s+(la|el|mi)?\\s*(tarjeta|debito|credito|cuenta|billetera)?\\s*(de\\s+|del\\s+)?(la\\s+|el\\s+)?(${terms})(?=\\s)`,'g'), ' ');
    s = s.replace(new RegExp(`(^|\\s)(${terms})(?=\\s)`,'g'), ' ');
  }
  s = s.replace(/\b(hoy|ayer|anteayer|antes de ayer)\b/g, ' ').replace(/\b(el|este|el pasado)\s+(domingo|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado)\b/g,' ').replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,' ');
  s = s.replace(/\b(gast[eé]|pagu[eé]|compr[eé]|me cobraron|cobr[eé]|me pagaron|me transfirieron|me depositaron|me pasaron|me mandaron|recib[ií]|vend[ií]|cargu[eé]|puse|sal[ií]|anot[aá]|sum[aá]|me entr[oó]|me entraron)\b/g, ' ');
  s = s.replace(/\$\s*/g,' ').replace(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?/g,' ').replace(/\bpesos\b/g,' ');
  s = s.replace(/\s+/g,' ').trim();
  let prev;
  do { prev = s; s = s.replace(/^(en|de|del|el|la|los|las|por|para|un|una|al|a|y|que|con)\s+/,'').replace(/\s+(en|de|del|con|el|la|por|y|a)$/,'').trim(); } while (s !== prev);
  return s ? s[0].toUpperCase() + s.slice(1) : '';
}
function parseLocal(text){
  const low = normAmounts(text.toLowerCase());
  const nAll = norm(low);
  const gAcc = detectAccount(nAll), gDate = detectDate(nAll);
  const AMT = /\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?/g;
  const hasAmt = p => (p.replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,'').match(AMT)||[]).length>0;
  const raw = low.split(/\s*(?:,(?!\d)|;|\s+y\s+|\s+tambi[eé]n\s+|\s+m[aá]s\s+)\s*/);
  const parts = [];
  for (const p of raw) { if (!p) continue; if (hasAmt(p) || !parts.length) parts.push(p); else parts[parts.length-1] += ' ' + p; }
  const out = [];
  for (const p of parts) {
    const amts = (p.replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,'').match(AMT)||[]).map(parseNum).filter(x=>x>0);
    if (!amts.length) continue;
    const np = norm(p);
    const tipo = INGRESO_RX.test(np) || INGRESO_RX.test(nAll) && parts.length===1 ? 'ingreso' : 'gasto';
    const cat = guessCat(p, tipo);
    out.push({ id: uid(), tipo, monto: Math.max(...amts), cat,
      cuenta: detectAccount(np) || gAcc || lastAcc(),
      fecha: detectDate(np) || gDate || ymd(today),
      desc: cleanDesc(p) || CAT[cat].n, origen: 'manual' });
  }
  return out;
}
function sanitize(m){
  if (!m || typeof m !== 'object') return null;
  const tipo = m.tipo === 'ingreso' ? 'ingreso' : 'gasto';
  const monto = Math.abs(parseNum(m.monto));
  if (!monto) return null;
  const cat = CAT[m.categoria] && CAT[m.categoria].t === tipo ? m.categoria : (tipo==='gasto'?'otros':'otros_in');
  const cuenta = ACCOUNTS.includes(m.cuenta) ? m.cuenta : lastAcc();
  const fecha = /^\d{4}-\d{2}-\d{2}$/.test(m.fecha||'') ? m.fecha : ymd(today);
  return { id: uid(), tipo, monto, cat, cuenta, fecha, desc: String(m.descripcion||CAT[cat].n).slice(0,60), origen:'manual' };
}
async function parseWithClaude(text){
  const cats = t => CATS.filter(c=>c.t===t).map(c=>`${c.id} (${c.n})`).join(', ');
  const prompt = `Convertí una frase dicha en español (puede ser rioplatense u otra variante) sobre gastos o ingresos personales en JSON.
Hoy es ${DOW[today.getDay()]} ${ymd(today)}. Moneda: ${CUR}.
Cuentas válidas (con otros nombres que puede usar la persona): ${ACC.map(a=>`${a.name}${a.alias&&a.alias.length?` (${a.alias.join(', ')})`:''}`).join('; ')}. Si no se menciona cuenta usá "${lastAcc()}".

Frase: ${JSON.stringify(text)}`;

/* ---------- Análisis: ingresos y gastos mes a mes ---------- */
function shiftYm(ym, d){ const [y,m] = ym.split('-').map(Number); return ymd(new Date(y, m-1+d, 1)).slice(0,7); }
const monthShort = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('es-AR', {month:'short'}).replace('.',''); };
const monthLong = ym => { const [y,m] = ym.split('-').map(Number); const s = new Date(y, m-1, 1).toLocaleDateString('es-AR', {month:'long', year:'numeric'}); return s[0].toUpperCase()+s.slice(1); };
function fmtShort(n){
  const a = Math.abs(n), s = n<0 ? '−' : '';
  if (a >= 1e6) return s + (a/1e6).toLocaleString('es-AR', {maximumFractionDigits:1}) + ' M';
  if (a >= 1e3) return s + Math.round(a/1e3).toLocaleString('es-AR') + ' mil';
  return s + Math.round(a);
}
function niceStep(max, ticks){
  const raw = max / ticks, p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  return [1, 2, 2.5, 5, 10].map(x=>x*p).find(x=>x >= raw) || p*10;
}
function monthSeries(n){
  const out = [];
  for (let i=n-1; i>=0; i--) {
    const ym = shiftYm(state.ym, -i), t = monthTotals(monthItems(ym));
    out.push({ ym, ing: t.i, gas: t.g, bal: t.i - t.g });
  }
  return out;
}
// Barras agrupadas (ingresos/gastos) o barras desde cero (balance). Un solo eje.
function barChart(id, data, width, mode){
  const H = 190, L = 48, R = 6, T = 10, B = 24, w = width - L - R, h = H - T - B;
  const vals = mode==='bal' ? data.map(d=>d.bal) : data.flatMap(d=>[d.ing, d.gas]);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if (max===min) max = 1;
  const step = niceStep(max - min, 4);
  max = Math.ceil(max/step)*step; min = Math.floor(min/step)*step;
  const y = v => T + h - (v - min) / (max - min) * h;
  const gw = w / data.length;
  let g = '';
  for (let v = min; v <= max + step/2; v += step) g += `<line x1="${L}" x2="${L+w}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtShort(v)}</text>`;
  const bar = (x, bw, v, color) => {
    if (!v) return '';
    const y0 = y(0), y1 = y(v), top = Math.min(y0, y1), hh = Math.max(Math.abs(y1 - y0), 1), r = Math.min(4, bw/2, hh);
    // Esquinas redondeadas solo en la punta; la base queda recta sobre el cero.
    return v > 0
      ? `<path d="M${x},${y0} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y0} Z" fill="${color}"/>`
      : `<path d="M${x},${y0} V${top+hh-r} Q${x},${top+hh} ${x+r},${top+hh} H${x+bw-r} Q${x+bw},${top+hh} ${x+bw},${top+hh-r} V${y0} Z" fill="${color}"/>`;
  };
  data.forEach((d, i) => {
    const x0 = L + i*gw, pad = Math.max(4, gw*0.18);
    if (mode==='bal') g += bar(x0+pad, gw-2*pad, d.bal, d.bal>=0 ? 'var(--v-ing)' : 'var(--v-gas)');
    else { const bw = (gw - 2*pad - 2) / 2; g += bar(x0+pad, bw, d.ing, 'var(--v-ing)') + bar(x0+pad+bw+2, bw, d.gas, 'var(--v-gas)'); }
    g += `<text x="${x0+gw/2}" y="${H-6}" text-anchor="middle" class="${d.ym===state.ym?'sel':''}">${esc(monthShort(d.ym))}</text>`;
    g += `<rect x="${x0}" y="${T}" width="${gw}" height="${h+B}" fill="transparent" data-i="${i}" data-chart="${id}" style="cursor:pointer"/>`;
  });
  g += `<line x1="${L}" x2="${L+w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="${mode==='bal'?'Balance por mes':'Ingresos y gastos por mes'}">${g}</svg><div class="tip" hidden></div></div>`;
}

function toCSV(){
  const q = v => { const s = String(v??''); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = allItems().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return '﻿' + [['fecha','tipo','monto','moneda','categoria','cuenta','descripcion','origen'].join(';'),
    ...rows.map(x=>[x.fecha, x.tipo, String(x.monto).replace('.',','), CUR, CAT[x.cat]?.n||x.cat, x.cuenta, x.desc, x.origen].map(q).join(';'))].join('\n');
}
async function exportCSV(){
  const csv = toCSV();
  let dl = null; try { dl = window.claude?.use ? await claude.use('downloads') : null; } catch(e) {}
  if (dl) {
    try { const r = await dl.save({ filename: `bolsillo-${ymd(today)}.csv`, data: csv }); if (r?.status==='saved') toast('Archivo descargado.'); return; }
    catch(e) { if (e?.code==='cancelled' || e?.code==='declined') return; }
  }
  if (!(window.claude && window.claude.use)) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = `bolsillo-${ymd(today)}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000); return;
  }
  try { await navigator.clipboard.writeText(csv); toast('Copié los movimientos en formato CSV. Pegalos en una planilla.'); }
  catch(e) { toast('No se pudo exportar desde acá.', true); }
}
async function login(){
  const p = new firebase.auth.GoogleAuthProvider(), u = store.auth.currentUser;
  try {
    if (u && u.isAnonymous) { await u.linkWithPopup(p); store.user = store.auth.currentUser; render(); toast('Listo: tus datos quedaron guardados en tu cuenta de Google.'); }
    else await store.auth.signInWithPopup(p);
  } catch(e) {
    // Si esa cuenta de Google ya tenía datos, se entra a esa cuenta (lo anotado sin cuenta en este navegador queda aparte).
    if (e.code==='auth/credential-already-in-use' && e.credential) await store.auth.signInWithCredential(e.credential);
    else if (!/popup-closed|cancelled-popup/.test(e.code||'')) toast('No se pudo iniciar sesión con Google.', true);

/* ---------- Grupos (gastos compartidos) ----------
   En modo cuenta: el grupo vive en groups/<id> y sus gastos en groups/<id>/exp/<id>,
   compartidos con quien tenga acceso a la página. La lista de grupos a los que te uniste
   y quién sos en cada uno van en tu espacio privado (doc "mygroups").
   En modo local todo queda en este navegador. */
const APP_URL = () => store.backend==='claude' ? 'https://claude.ai/artifact/1MhimAW1gNEZwX9e4AYVZh' : location.origin + location.pathname;
const G = { groups: {}, exps: {}, unsub: {}, hashChecked: false };
const r2 = n => Math.round(n*100)/100;
const myGroups = () => store.docs.mygroups?.list || [];
function setMyGroups(list){ saveDoc('mygroups', { list }); }
const meIn = gid => myGroups().find(x=>x.id===gid)?.me || null;
function gGroup(id){ return store.mode==='db' ? G.groups[id] : store.docs['g-'+id]?.group; }
function gExps(id){ const m = store.mode==='db' ? G.exps[id] : store.docs['g-'+id]?.exps; return Object.entries(m||{}).map(([k,v])=>({...v, id:k})); }
function gRerender(){
  if (state.tab!=='grupos') return;
  const a = document.activeElement;
  if (a && a.closest && a.closest('#tab-grupos') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  render();
}
function gWatch(){
  if (store.mode!=='db') return;
  for (const {id} of myGroups()) if (!G.unsub['g:'+id])
    G.unsub['g:'+id] = store.db.doc('groups/'+id).onSnapshot(s => { G.groups[id] = s.exists ? s.data() : null; gRerender(); }, () => {});
  if (state.gid && !G.unsub['e:'+state.gid]) {
    const id = state.gid;
    G.unsub['e:'+id] = store.db.collection('groups/'+id+'/exp').onSnapshot(s => {
      const m = {}; for (const d of s.docs) if (d.exists) m[d.id] = d.data(); G.exps[id] = m; gRerender();
    }, () => {});
  }
}
function gWriteErr(e){ toast(e?.code==='invalid_argument' ? 'No tenés permiso para escribir en este grupo. Pedile a quien creó el grupo que te invite por mail como Editor desde el menú Compartir.' : e?.code==='permission-denied' ? 'No tenés permiso para escribir en este grupo.' : 'No se pudo guardar en el grupo. Revisá la conexión.', true); }
function gSetGroup(id, data){
  if (store.mode==='db') { G.groups[id] = data; store.db.doc('groups/'+id).set(data).catch(gWriteErr); }
  else { const d = clone(store.docs['g-'+id] || {exps:{}}); d.group = data; saveDoc('g-'+id, d); }
}
function gSetExp(gid, eid, data){
  if (store.mode==='db') { G.exps[gid] = {...(G.exps[gid]||{}), [eid]: data}; store.db.doc(`groups/${gid}/exp/${eid}`).set(data).catch(gWriteErr); }
  else { const d = clone(store.docs['g-'+gid] || {exps:{}}); d.exps[eid] = data; saveDoc('g-'+gid, d); }
}
function gDelExp(gid, eid){
  if (store.mode==='db') { const m = {...(G.exps[gid]||{})}; delete m[eid]; G.exps[gid] = m; store.db.doc(`groups/${gid}/exp/${eid}`).delete().catch(gWriteErr); }
  else { const d = clone(store.docs['g-'+gid] || {exps:{}}); delete d.exps[eid]; saveDoc('g-'+gid, d); }
}
function splitEqual(amount, ids){
  const out = {}; if (!ids.length) return out;
  const base = Math.floor(amount*100/ids.length)/100; let rest = r2(amount - base*ids.length);
  ids.forEach(id => { out[id] = base; });
  for (let i=0; rest>0.001; i=(i+1)%ids.length) { out[ids[i]] = r2(out[ids[i]]+0.01); rest = r2(rest-0.01); }
  return out;
}
function gBalances(g, exps){
  const b = {}; for (const m of g.members) b[m.id] = 0;
  for (const e of exps) { b[e.paidBy] = r2((b[e.paidBy]||0) + e.amount); for (const [mid, sh] of Object.entries(e.split||{})) b[mid] = r2((b[mid]||0) - sh); }
  return b;
}
function gSettle(b){
  const deb = Object.entries(b).filter(([,v])=>v<-0.009).map(([id,v])=>({id, v:-v})).sort((a,c)=>c.v-a.v);
  const cre = Object.entries(b).filter(([,v])=>v>0.009).map(([id,v])=>({id, v})).sort((a,c)=>c.v-a.v);
  const out = []; let i=0, j=0;
  while (i<deb.length && j<cre.length) {
    const x = r2(Math.min(deb[i].v, cre[j].v));
    if (x>0) out.push({from: deb[i].id, to: cre[j].id, amount: x});
    deb[i].v = r2(deb[i].v-x); cre[j].v = r2(cre[j].v-x);
    if (deb[i].v<0.01) i++; if (cre[j].v<0.01) j++;
  }
  return out;
}
function gJoin(code){
  code = norm(code).replace(/[^a-z0-9]/g,'');
  if (!code) return;
  if (myGroups().some(x=>x.id===code)) { state.gid = code; state.tab = 'grupos'; render(); return; }
  if (store.mode!=='db') { toast('Para unirte a un grupo de otra persona tenés que abrir Bolsillo con tu cuenta de Claude.', true); return; }
  store.db.doc('groups/'+code).get().then(s => {
    if (!s.exists) { toast('No encontré un grupo con ese código. Revisalo y probá de nuevo.', true); return; }
    G.groups[code] = s.data();
    setMyGroups([...myGroups(), {id: code, me: null}]);
    state.gid = code; state.tab = 'grupos'; render(); toast(`Te uniste a "${s.data().name}".`);
  }).catch(() => toast('No pude buscar el grupo. Revisá la conexión.', true));
}
function gParse(text, g, me){
  const p = parseLocal(text)[0]; if (!p) return null;
  const n = norm(text);
  let paidBy = null;
  for (const m of g.members) if (m.id!==me && new RegExp('(^|[^a-z])' + rxEsc(norm(m.name)) + '($|[^a-z])').test(n)) { paidBy = m.id; break; }
  if (!paidBy && /\b(pague|puse|gaste|compre|aboné|abone)\b/.test(n)) paidBy = me;
  let desc = p.desc;
  for (const m of g.members) desc = desc.replace(new RegExp('(^|\\s)' + rxEsc(norm(m.name)) + '(\\s+pago)?(?=\\s|$)','i'), ' ').trim();
  desc = desc.replace(/^(pago|pagaron)\s+/i,'').replace(/^(de|del|la|el|en|por|para)\s+/i,'').trim();
  return { desc: desc ? desc[0].toUpperCase()+desc.slice(1) : 'Gasto', amount: p.monto, fecha: p.fecha, paidBy: paidBy || me || g.members[0].id, parts: g.members.map(m=>m.id), mine: true };
}

function processInbox(key, list){

  const manual = all.filter(x=>x.origen==='manual' && !x.ext);
  const add = [], upd = [];
  for (const m of list) {

    if (seen.has(ref)) continue;
    if (m.text) {

      parseLocal(String(m.text)).forEach((it, i) => add.push({ ...it, id: ref + (i ? '-' + i : ''), ext: i ? undefined : ref, origen: 'auto', pend: true, ts: Date.now() }));
      continue;
    }
    const tipo = m.tipo==='ingreso' ? 'ingreso' : 'gasto', monto = Math.abs(Number(m.amount)) || 0;
    if (!monto) continue;
    const fecha = /^\d{4}-\d{2}-\d{2}$/.test(m.fecha||'') ? m.fecha : ymd(today);
    const desc = String(m.desc||'').trim().slice(0,80) || (tipo==='gasto' ? 'Gasto' : 'Ingreso');
    // Si ya lo anotaste a mano o por voz, se marca como conciliado en vez de duplicarlo.
    const mi = manual.findIndex(x=>x.tipo===tipo && Math.abs(x.monto-monto)<0.01 && Math.abs((toDate(x.fecha)-toDate(fecha))/864e5)<=2);
    if (mi>-1) { upd.push({ ...clone(manual[mi]), conc: true, ext: ref }); manual.splice(mi,1); continue; }
    const cuenta = detectAccount(norm(m.source||'')) || lastAcc();
    add.push({ id: ref, ext: ref, tipo, monto, cat: guessCat(desc, tipo), cuenta, fecha, desc, origen: 'auto', pend: true, ts: Date.now() });
  }
  if (add.length || upd.length) putItems([...add, ...upd]);
  for (const m of list) store.db.doc(`inbox/${key}/items/${m.id}`).delete().catch(()=>{});
  if (add.length) toast(add.length===1 ? `Se anotó solo: ${fmt(add[0].monto)} · ${add[0].desc}` : `Se anotaron solos ${add.length} movimientos. Revisalos en Movimientos.`);

function interpretar(msg) {
  const remitente = msg.getFrom().toLowerCase();
  const fuente = FUENTES.find(f => remitente.includes(f.buscar));
  if (!fuente) return null;
  const asunto = msg.getSubject() || '';
  const cuerpo = (msg.getPlainBody() || '').replace(/\\s+/g, ' ').slice(0, 3000);
  if (IGNORAR.test(asunto)) return null;
  const inicio = cuerpo.slice(0, 500);
  const tipo = INGRESO.test(asunto) ? 'ingreso' : GASTO.test(asunto) ? 'gasto'
    : INGRESO.test(inicio) ? 'ingreso' : GASTO.test(inicio) ? 'gasto' : null;
  if (!tipo) return null;
  const m = (asunto + ' ' + cuerpo).match(/\\$\\s?(\\d{1,3}(?:\\.\\d{3})*(?:,\\d{1,2})?|\\d+(?:,\\d{1,2})?)/);
  if (!m) return null;
  const monto = Number(m[1].replace(/\\./g, '').replace(',', '.'));
  if (!(monto > 0)) return null;
  return {
    tipo, monto, cuenta: fuente.cuenta, desc: descripcion(asunto, cuerpo),
    fecha: Utilities.formatDate(msg.getDate(), Session.getScriptTimeZone(), 'yyyy-MM-dd'),
  };
}

function descripcion(asunto, cuerpo) {
  // Transferencias (formato de BBVA y otros bancos): el nombre viene en una tabla.
  const corte = /\\s+(?:\\d{1,2}\\/\\d{1,2}\\/\\d{2,4}|Fecha|CBU|CVU|CUIT|CUIL|Cuenta|Alias|Banco|Importe|Monto|Concepto|Referencia|\\$)/.source;
  const dest = cuerpo.match(new RegExp(/Destinatario\\s+(?:Fecha y hora\\s+)?(.{3,60}?)/.source + corte, 'i'));
  if (dest) return 'Transferencia a ' + dest[1].trim();
  const orig = cuerpo.match(new RegExp(/(?:Ordenante|Originante|Remitente)\\s+(?:Fecha y hora\\s+)?(.{3,60}?)/.source + corte, 'i'));
  if (orig) return 'Transferencia de ' + orig[1].trim();
  const patrones = [
    /(?:pagaste|tu pago|compraste|tu compra|consumo|compra)\\s+(?:a|en|de)\\s+([^.,$\\n]{2,40})/i,
    /(?:transferiste|enviaste)[^$]*?\\s+a\\s+([^.,$\\n]{2,40})/i,
    /(?:recibiste|te envi[oó]|te transfiri[oó])[\\s\\S]{0,40}?\\s+de\\s+([^.,$\\n]{2,40})/i,
  ];
  for (const p of patrones) {
    const r = asunto.match(p) || cuerpo.slice(0, 600).match(p);
    if (r) return r[1].replace(/\\s+(fue|por|con|el d[ií]a|de \\$).*$/i, '').trim();
  }
  return asunto.slice(0, 60);
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).slice(0,10).join('\n');
  const delim = [';',',','\t'].map(d=>[d, lines.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){
    const ch = text[i];
    if (q) { if (ch==='"') { if (text[i+1]==='"') { cell+='"'; i++; } else q = false; } else cell += ch; }
    else if (ch==='"') q = true;
    else if (ch===delim) { row.push(cell); cell=''; }
    else if (ch==='\n' || ch==='\r') { if (ch==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()));

function guessMap(head){

  const find = (rx, not=[]) => H.findIndex((h,i)=>rx.test(h) && !not.includes(i) && !/saldo|balance/.test(h));
  const date = find(/fecha|date/);
  const debit = find(/debito|debe\b|egreso|debit/, [date]);
  const credit = find(/credito|haber|ingreso|abono|credit/, [date, debit]);
  const desc = find(/descrip|concepto|detalle|leyenda|referencia|movimiento|operacion|description|comercio/, [date, debit, credit]);
  const amount = find(/importe|monto|amount|valor|neto|total|pesos/, [date, debit, credit, desc]);

function buildImport(){
  const s = state.imp; if (!s.rows) return null;
  const mp = s.map, useDC = mp.debit>-1 || mp.credit>-1;
  const existing = new Set(); const manual = [];
  for (const it of allItems()) { if (it.ext) existing.add(it.ext); if (it.origen==='manual' && !it.ext) manual.push(it); }
  const seen = {}; const movs = []; let dup = 0, matched = 0; const used = new Set();
  for (const r of s.rows.slice(s.header+1)) {
    const fecha = parseDate(r[mp.date]); if (!fecha) continue;
    let val;
    if (useDC) { const d = parseNum(r[mp.debit]), c = parseNum(r[mp.credit]); val = (isNaN(c)?0:Math.abs(c)) - (isNaN(d)?0:Math.abs(d)); }
    else val = parseNum(r[mp.amount]);
    if (!val || isNaN(val)) continue;
    if (s.invert) val = -val;
    const desc = String(mp.desc>-1 ? (r[mp.desc]??'') : '').replace(/\s+/g,' ').trim();
    if (/^saldo/.test(norm(desc))) continue;
    const base = `${s.account}|${fecha}|${val.toFixed(2)}|${norm(desc)}`;
    seen[base] = (seen[base]||0) + 1;
    const ext = hash(base + '#' + seen[base]);
    if (existing.has(ext)) { dup++; continue; }
    const tipo = val<0 ? 'gasto' : 'ingreso', monto = Math.abs(val);
    const fd = toDate(fecha);
    const mi = manual.findIndex(x=>!used.has(x.id) && x.tipo===tipo && Math.abs(x.monto-monto)<0.01 && x.cuenta===s.account && Math.abs((toDate(x.fecha)-fd)/86400000)<=3);

  if (!ACCOUNTS.includes(s.account)) s.account = ACCOUNTS[0];
  const sel = (id, v, head) => `<select id="${id}"><option value="-1">—</option>${head.map((h,i)=>`<option value="${i}"${i===v?' selected':''}>${esc(String(h).slice(0,40)||'Columna '+(i+1))}</option>`).join('')}</select>`;
  let h = `<p>Bajá los movimientos desde el home banking o desde Mercado Pago en CSV o Excel y cargalos acá. Si un movimiento coincide con un gasto que anotaste a mano, se marca como conciliado y no se cuenta dos veces.</p>
    <label class="field">Cuenta del extracto<select id="impAccount">${ACCOUNTS.map(a=>`<option${a===s.account?' selected':''}>${esc(a)}</option>`).join('')}</select></label>
    <label class="file">${s.file ? `Archivo: <b>${esc(s.file)}</b> · elegí otro si querés` : 'Elegí el archivo (.csv, .xls o .xlsx)'}<input type="file" id="impFile" accept=".csv,.txt,.xls,.xlsx,text/csv"></label>
    <details><summary>Dónde descargo los movimientos</summary><ul>
      <li><b>Mercado Pago:</b> desde la web, en la sección de actividad o reportes, descargá el detalle de movimientos de tu cuenta en CSV o Excel.</li>
      <li><b>Galicia, BBVA, Nación, Provincia:</b> en el home banking entrá a los movimientos de la cuenta y buscá la opción de descargar o exportar en Excel o CSV.</li>
      <li><b>Tarjetas de crédito:</b> si los consumos vienen en positivo, marcá "Invertir signo" después de cargar el archivo.</li>
      <li>Los resúmenes en PDF todavía no se pueden leer.</li></ul></details>`;
  if (s.busy) h += `<div class="empty"><span class="spin" aria-hidden="true"></span><span>Leyendo el archivo…</span></div>`;
  if (s.rows) {
    const head = s.rows[s.header] || [];
    h += `<h2>Columnas</h2><div class="grid">
      <label>Fecha${sel('mDate', s.map.date, head)}</label>
      <label>Descripción${sel('mDesc', s.map.desc, head)}</label>
      <label>Importe (con signo)${sel('mAmount', s.map.amount, head)}</label>
      <label>Débito / egreso${sel('mDebit', s.map.debit, head)}</label>
      <label>Crédito / ingreso${sel('mCredit', s.map.credit, head)}</label>
      <label>Fila de títulos<input id="mHeader" type="number" min="1" max="${s.rows.length}" value="${s.header+1}"></label></div>
      <label class="check"><input type="checkbox" id="mInvert" ${s.invert?'checked':''}><span>Invertir signo (los gastos vienen en positivo)</span></label>`;
    const r = buildImport();
    if (!r || (!r.movs.length && !r.dup)) h += `<div class="status">No encontré movimientos con esas columnas. Revisá cuál es la columna de fecha y la de importe.</div>`;
    else {
      const fechas = r.movs.map(m=>(m.item||m.match).fecha).sort();
      h += `<div class="stats">Encontré <b>${r.nuevos}</b> movimiento${r.nuevos===1?'':'s'} nuevo${r.nuevos===1?'':'s'}${fechas.length?` entre el ${esc(dayLabel(fechas[0]))} y el ${esc(dayLabel(fechas[fechas.length-1]))}`:''}.
        ${r.matched?`<br>${r.matched} coincide${r.matched>1?'n':''} con gastos anotados a mano y se ${r.matched>1?'van':'va'} a marcar como conciliado${r.matched>1?'s':''}.`:''}
        ${r.dup?`<br>${r.dup} ya estaba${r.dup>1?'n':''} importado${r.dup>1?'s':''} y se omite${r.dup>1?'n':''}.`:''}</div>`;
      const prev = r.movs.filter(m=>m.item).slice(0,8);
      if (prev.length) h += `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th class="r">Importe</th></tr></thead><tbody>${prev.map(({item:it})=>`<tr><td class="num">${esc(it.fecha.slice(8)+'/'+it.fecha.slice(5,7))}</td><td class="d">${esc(it.desc)}</td><td>${esc(CAT[it.cat].n)}</td><td class="r num" style="color:${it.tipo==='gasto'?'var(--ink)':'var(--ingreso)'}">${it.tipo==='gasto'?'−':'+'}${fmt(it.monto)}</td></tr>`).join('')}</tbody></table></div>`;
      if (r.nuevos || r.matched) h += `<div class="btn-row"><button type="button" class="btn primary" data-action="doimport">Importar ${r.nuevos} movimiento${r.nuevos===1?'':'s'}</button><button type="button" class="btn" data-action="clearimport">Cancelar</button></div>`;
    }
  }
  el.innerHTML = h;
}
async function readFile(file){
  const s = state.imp; s.busy = true; s.rows = null; s.file = file.name; render();
  try {
    const buf = await file.arrayBuffer();
    let rows;
    if (/\.xlsx?$/i.test(file.name)) {
      const X = await loadXLSX();
      const wb = X.read(buf, {type:'array'});
      rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
    } else rows = parseCSV(decode(buf));
    rows = rows.filter(r=>Array.isArray(r) && r.some(c=>String(c).trim()));
    if (!rows.length) throw new Error('vacío');
    s.rows = rows; s.header = detectHeader(rows); s.map = guessMap(rows[s.header].map(String)); s.invert = false;
    // Si ya se importó un archivo con el mismo formato para esta cuenta, se reusan las columnas elegidas.
    const prof = config()?.importProfiles?.[s.account];
    if (prof && rows[prof.header] && headerSig(rows[prof.header]) === prof.sig) { s.header = prof.header; s.map = {...prof.map}; s.invert = !!prof.invert; toast('Usé las columnas de la última importación de esta cuenta.'); }
  } catch(e) {
    s.file = '';
    toast(e.message==='xlsx' ? 'No se pudo cargar el lector de Excel. Probá exportar en CSV.' : 'No pude leer ese archivo. Probá exportarlo en CSV o Excel.', true);
  }
  s.busy = false; render();
}
function doImport(){
  const r = buildImport(); if (!r) return;
  const news = r.movs.filter(m=>m.item).map(m=>({...m.item, ts: Date.now()}));
  const matches = r.movs.filter(m=>m.match).map(m=>({...clone(m.match), conc: true, ext: m.ext}));
  putItems([...news, ...matches]);
  toast(`Importé ${news.length} movimiento${news.length===1?'':'s'}${matches.length?` y concilié ${matches.length}`:''}.`);
  if (news.length) state.ym = news.map(x=>x.fecha).sort().pop().slice(0,7);
  const s = state.imp;
  cfgEdit(c => { c.importProfiles = c.importProfiles || {}; c.importProfiles[s.account] = { sig: headerSig(s.rows[s.header]), header: s.header, map: {...s.map}, invert: s.invert }; });
  s.rows = null; s.file = ''; state.tab = 'movs'; render();
}
async function aiCats(){
  if (!store.sample || state.catBusy) return;
  const items = monthItems(state.ym).filter(x=>x.cat==='otros'||x.cat==='otros_in').slice(0,150);
  if (!items.length) return;
  state.catBusy = true; render();
  try {
    const cats = t => CATS.filter(c=>c.t===t).map(c=>`${c.id} (${c.n})`).join(', ');
    const prompt = `Asigná una categoría a cada movimiento bancario argentino según su descripción.
Categorías de gasto: ${cats('gasto')}.
Categorías de ingreso: ${cats('ingreso')}.
Usá solo categorías del mismo tipo que el movimiento. Si no hay pista, dejá "otros" u "otros_in".
Respondé solo con JSON: {"<n>":"<id>", ...}

${items.map((x,i)=>`${i}\t${x.tipo}\t${x.desc}`).join('\n')}`;
    const res = await store.sample.json(prompt, { modelTier: 'quick' });
    const upd = [];
    items.forEach((x,i) => { const c = res?.[i] ?? res?.[String(i)]; if (CAT[c] && CAT[c].t===x.tipo && c!==x.cat) upd.push({...clone(x), cat:c}); });
    if (upd.length) putItems(upd);
    toast(upd.length ? `Recategoricé ${upd.length} movimiento${upd.length>1?'s':''}.` : 'No encontré mejores categorías para esos movimientos.');
  } catch(e) { toast(e?.code==='rate_limited' ? 'Claude está ocupado. Probá en un rato.' : 'No se pudo categorizar ahora.', true); if (e?.code==='not_granted') store.sample = null; }
  state.catBusy = false; render();
}

/* ---------- Eventos ---------- */
let toastT;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err?' err':''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, 3500); }
function shiftMonth(d){ const [y,m] = state.ym.split('-').map(Number); const n = new Date(y, m-1+d, 1); state.ym = ymd(n).slice(0,7); state.editId = null; render(); }

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; render(); return; }
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action;
  if (a==='prev') shiftMonth(-1);
  else if (a==='next') shiftMonth(1);
  else if (a==='anotar') anotar();
  else if (a==='example') { $('#frase').value = b.dataset.v; $('#frase').focus(); }
  else if (a==='settipo') {
    const pfx = b.dataset.pfx;
    if (pfx==='e') { const it = readForm('e', state.editBuf); it.tipo = b.dataset.v; it.cat = guessCat(it.desc, it.tipo); state.editBuf = it; render(); }
    else { const i = +pfx.slice(1); const it = readForm(pfx, state.drafts[i]); it.tipo = b.dataset.v; it.cat = guessCat(it.desc, it.tipo); state.drafts[i] = it; renderComposer(); }
  }
  else if (a==='dropdraft') { state.drafts = state.drafts.map((d,i)=>readForm('d'+i,d)).filter((_,i)=>i!==+b.dataset.i); renderComposer(); }
  else if (a==='discard') { state.drafts = []; renderComposer(); }
  else if (a==='savedrafts') {
    const items = state.drafts.map((d,i)=>({...readForm('d'+i,d), ts: Date.now()+i}));
    if (items.some(x=>!x.monto)) { toast('Falta el monto en algún movimiento.', true); return; }
    putItems(items); lsSet('bolsillo:lastAcc', items[items.length-1].cuenta);
    state.drafts = []; state.ym = items[0].fecha.slice(0,7); state.tab = 'movs'; state.filterAcc = null; state.filterCat = null;
    renderComposer(); render();
    toast(items.length>1 ? `Anoté ${items.length} movimientos.` : `Anotado: ${fmt(items[0].monto)} en ${CAT[items[0].cat].n}.`);
  }
  else if (a==='edit') {
    const id = b.dataset.id;
    if (state.editId===id) { state.editId = null; state.editBuf = null; }
    else { state.editId = id; state.editBuf = clone(monthItems(state.ym).find(x=>x.id===id)); }
    state.confirmDel = null; render();
  }
  else if (a==='canceledit') { state.editId = null; state.editBuf = null; render(); }
  else if (a==='saveedit') {
    const orig = monthItems(state.ym).find(x=>x.id===state.editId); if (!orig) return;
    const it = readForm('e', state.editBuf);
    delete it.pend;
    if (!it.monto) { toast('El monto no puede quedar vacío.', true); return; }
    if (it.fecha.slice(0,7) !== orig.fecha.slice(0,7)) removeItem(orig.id, orig.fecha);
    const learn = $('#e-learn')?.checked && learnKey(it.desc);
    putItems([it]); state.editId = null; state.editBuf = null;
    if (learn) {
      cfgEdit(c => { c.cats = c.cats || clone(DEFAULT_CATS); for (const x of c.cats) { x.k = x.k.filter(k=>k!==learn); if (x.id===it.cat) x.k.unshift(learn); } });
      const others = allItems().filter(x=>x.id!==it.id && x.tipo===it.tipo && x.cat!==it.cat && norm(x.desc).includes(learn)).map(x=>({...clone(x), cat: it.cat}));
      if (others.length) putItems(others);
      toast(`Listo. "${learn}" va a ir siempre a ${CAT[it.cat].n}${others.length?` (actualicé ${others.length} más)`:''}.`);
    } else toast('Cambios guardados.');
    render();
  }
  else if (a==='del') {
    if (state.confirmDel !== state.editId) { state.editBuf = readForm('e', state.editBuf); state.confirmDel = state.editId; render(); return; }
    const orig = monthItems(state.ym).find(x=>x.id===state.editId);
    if (orig) removeItem(orig.id, orig.fecha);
    state.editId = null; state.editBuf = null; state.confirmDel = null; render(); toast('Movimiento borrado.');
  }
  else if (a==='facc') { state.filterAcc = b.dataset.v || null; render(); }
  else if (a==='fcat') { state.filterCat = b.dataset.v || null; state.tab = 'movs'; render(); }
  else if (a==='doimport') doImport();
  else if (a==='clearimport') { state.imp.rows = null; state.imp.file = ''; render(); }
  else if (a==='aicats') aiCats();
  else if (a==='setuptoggle') { const s = state.setup.sel, v = b.dataset.v; s.has(v) ? s.delete(v) : s.add(v); renderSetup(); }
  else if (a==='setupadd') {
    const v = $('#setupNew').value.trim(); if (!v) return;
    if (![...PRESET_ACCOUNTS, ...state.setup.custom].some(x=>norm(x.name)===norm(v))) state.setup.custom.push(newAccount(v));
    state.setup.sel.add([...PRESET_ACCOUNTS, ...state.setup.custom].find(x=>norm(x.name)===norm(v)).name); renderSetup();
  }
  else if (a==='setupdone') {
    const all = [...PRESET_ACCOUNTS, ...state.setup.custom];
    saveConfig({ v: CONFIG_V, currency: state.setup.cur, accounts: all.filter(x=>state.setup.sel.has(x.name)).map(clone), cats: clone(DEFAULT_CATS), importProfiles: {} });
    if (!ACCOUNTS.includes(state.imp.account)) state.imp.account = ACCOUNTS[0];
    render(); renderComposer();
  }
  else if (a==='addacc') {
    const v = (b.dataset.v || $('#newAcc').value).trim(); if (!v) return;
    if (ACCOUNTS.some(x=>norm(x)===norm(v))) { toast('Esa cuenta ya está.'); return; }
    cfgEdit(c => c.accounts.push(newAccount(v))); render();
  }
  else if (a==='delacc') { cfgEdit(c => c.accounts.splice(+b.dataset.i, 1)); render(); }
  else if (a==='addcat') {
    const n = $('#newCat').value.trim(), tipo = $('#newCatTipo').value; if (!n) return;
    cfgEdit(c => { c.cats = c.cats || clone(DEFAULT_CATS); const pos = c.cats.findIndex(x=>x.id===(tipo==='gasto'?'otros':'otros_in'));
      c.cats.splice(pos<0?c.cats.length:pos, 0, { id: 'c' + uid(), n, t: tipo, c: c.cats.length % 8, k: [] }); });
    render();
  }
  else if (a==='delcat') {
    const id = b.dataset.id, tipo = CAT[id]?.t;
    const moved = allItems().filter(x=>x.cat===id).map(x=>({...clone(x), cat: tipo==='ingreso'?'otros_in':'otros'}));
    if (moved.length) putItems(moved);
    cfgEdit(c => { c.cats = (c.cats || clone(DEFAULT_CATS)).filter(x=>x.id!==id); }); render();
    toast(moved.length ? `Categoría quitada. ${moved.length} movimiento${moved.length>1?'s pasaron':' pasó'} a "Otros".` : 'Categoría quitada.');
  }
  else if (a==='export') exportCSV();
  else if (a==='confirmall') { putItems(monthItems(state.ym).filter(x=>x.pend).map(x=>{ const y = clone(x); delete y.pend; return y; })); render(); toast('Movimientos confirmados.'); }
  else if (a==='inboxon') { const k = randomKey(24); cfgEdit(c => c.inboxKey = k); render(); }
  else if (a==='inboxreset') { if (state.confirmDel!=='inbox') { state.confirmDel = 'inbox'; render(); return; } state.confirmDel = null; if (store.inboxUnsub) { store.inboxUnsub(); store.inboxUnsub = null; } cfgEdit(c => c.inboxKey = randomKey(24)); render(); toast('Clave nueva generada. Actualizá el script de Gmail y el atajo de Siri.'); }
  else if (a==='copyscript') copyText(gmailScript(), 'Código copiado. Pegalo en Google Apps Script.');
  else if (a==='copykey') copyText(inboxURL(), 'Dirección copiada. Pegala en el atajo de Siri.');
  else if (a==='mic') listen('#frase', anotar);
  else if (a==='login') login();
  else if (a==='logout') store.auth.signOut();
});
document.addEventListener('change', e => {
  const t = e.target, s = state.imp;
  if (t.id==='setupCur') { state.setup.cur = t.value; return; }
  if (t.id==='setCur') { cfgEdit(c => c.currency = t.value); render(); return; }
  if (t.dataset.cfg) {
    const list = v => v.split(',').map(x=>norm(x).trim()).filter(Boolean);
    cfgEdit(c => {
      c.cats = c.cats || clone(DEFAULT_CATS);
      const cat = c.cats.find(x=>x.id===t.dataset.id);
      if (t.dataset.cfg==='accAlias') c.accounts[+t.dataset.i].alias = list(t.value);
      else if (t.dataset.cfg==='catName' && cat && t.value.trim()) cat.n = t.value.trim().slice(0,30);
      else if (t.dataset.cfg==='catKw' && cat) cat.k = list(t.value);
    });
    toast('Guardado.'); return;
  }
  if (t.id==='impFile' && t.files[0]) readFile(t.files[0]);
  else if (t.id==='impAccount') { s.account = t.value; lsSet('bolsillo:impAcc', t.value); render(); }
  else if (t.id==='mHeader') { const v = Math.max(1, Math.min(s.rows.length, +t.value||1)) - 1; s.header = v; s.map = guessMap(s.rows[v].map(String)); render(); }
  else if (['mDate','mDesc','mAmount','mDebit','mCredit'].includes(t.id)) { const k = {mDate:'date',mDesc:'desc',mAmount:'amount',mDebit:'debit',mCredit:'credit'}[t.id]; s.map[k] = +t.value; render(); }
  else if (t.id==='mInvert') { s.invert = t.checked; render(); }
});
$('#frase').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); anotar(); } });

/* ---------- Arranque ---------- */
function setStatus(msg){ const s = $('#status'); s.textContent = msg || ''; s.hidden = !msg; }
function useLocal(){
  store.mode = 'local';
  store.docs = lsGet('bolsillo:docs', {}) || {};
  render(); renderComposer();
}
function startSync(db, path, id){
  store.db = db; store.uid = id;
  store.col = db.collection(path);
  store.col.onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) if (d.exists) next[d.id] = d.data();
    for (const k in store.pending) if (store.docs[k]) next[k] = store.docs[k];
    store.docs = next;
    if (store.mode !== 'db') { store.mode = 'db'; renderComposer(); }
    const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest('.form, #tab-import, #tab-ajustes, #setup');
    if (!editing) render();
  }, () => setStatus('Se cortó la conexión con tus datos. Recargá la página para seguir.'));
}
async function initClaude(){
  let db = null, user = null, id = null;
  try { [db, user, store.sample] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('sample')]); } catch(e) {}
  if (db && user) { try { id = await user.id(); } catch(e) {} }
  if (!db || !id) { useLocal(); setStatus('No pude conectar con tu cuenta: los movimientos se guardan solo en este navegador.'); return; }
  store.backend = 'claude';
  startSync(db, 'data/users/' + id, id);
}
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function initFirebase(){
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    for (const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js']) await loadScript(base + f);
    firebase.initializeApp(window.BOLSILLO_FIREBASE);
    const db = firebase.firestore();
    db.settings({ ignoreUndefinedProperties: true, merge: true });
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    store.backend = 'firebase'; store.auth = firebase.auth();
    store.auth.onAuthStateChanged(u => {
      if (!u) { store.auth.signInAnonymously().catch(() => { useLocal(); setStatus('No pude conectar con el servidor: los movimientos se guardan solo en este navegador.'); }); return; }
      if (store.uid && store.uid !== u.uid) { location.reload(); return; }
      store.user = u;
      if (!store.uid) startSync(db, 'users/' + u.uid + '/docs', u.uid);
      else render();
    });
  } catch(e) {
    useLocal(); setStatus('No pude cargar la sincronización: los movimientos se guardan solo en este navegador.');
  }
}
async function init(){
  render(); renderComposer();
  if (window.claude && typeof window.claude.use === 'function') return initClaude();
  if (window.BOLSILLO_FIREBASE && window.BOLSILLO_FIREBASE.apiKey) return initFirebase();
  useLocal();
}
init();
</script>
